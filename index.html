<!-- Kada Central - Secure Order & Survey Form -->
<section id="order-section" style="max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; font-family: Arial, sans-serif; background-color: #f9f9f9;">
  <h2 style="color: #2c3e50; text-align: center;">🛒 Kada Central - ஆன்லைன் ஆர்டர் & கருத்துப் படிவம்</h2>
  <p style="text-align: center; color: #7f8c8d; font-size: 14px;">🔒 AI Anti-Spam & SSL பாதுகாக்கப்பட்ட படிவம்</p>

  <!-- Formspree அல்லது உங்கள் backend இணைப்பிற்கான படிவம் -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" id="kadaOrderForm">
    
    <!-- வாடிக்கையாளர் பெயர் -->
    <div style="margin-bottom: 15px;">
      <label for="name" style="display: block; font-weight: bold; margin-bottom: 5px;">உங்கள் பெயர் / Name:</label>
      <input type="text" id="name" name="name" required placeholder="எ.கா: சுரேஷ்" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
    </div>

    <!-- வாட்ஸ்அப் எண் -->
    <div style="margin-bottom: 15px;">
      <label for="phone" style="display: block; font-weight: bold; margin-bottom: 5px;">வாட்ஸ்அப் எண் / WhatsApp No:</label>
      <input type="tel" id="phone" name="phone" required placeholder="07XXXXXXXX" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
    </div>

    <!-- தேவைப்படும் பொருள் / கருத்து -->
    <div style="margin-bottom: 15px;">
      <label for="product" style="display: block; font-weight: bold; margin-bottom: 5px;">தேவையான பொருட்கள் / கருத்துகள் (Order / Survey):</label>
      <textarea id="product" name="product_details" rows="4" required placeholder="உங்களுக்குத் தேவையான பொருட்கள் மற்றும் அளவைக் குறிப்பிடவும்..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>
    </div>

    <!-- AI Honeypot Bot Trap (போலி பாட்களைப் பிடிக்கும் ரகசியப் பாதுகாப்புத் துறை) -->
    <input type="text" name="_gotcha" style="display:none !important;" tabindex="-1" autocomplete="off">

    <!-- சப்மிட் பொத்தான் -->
    <button type="submit" style="width: 100%; background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;">
      🚀 பாதுகாப்பாக ஆர்டர் செய் / Submit Order
    </button>
  </form>
</section

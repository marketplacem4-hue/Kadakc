<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kada Central - Vendor Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f172a; color: #fff; margin: 0; padding: 20px; }
    
    .container { max-width: 500px; margin: 20px auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    p { font-size: 13px; color: #94a3b8; text-align: center; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
    
    .btn { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .btn:hover { background: #16a34a; }

    .calc-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 13px; }
    .calc-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🏪 கடைக்காரர் கணக்கு பதிவு (Vendor Entry)</h2>
    <p>உள்ளூர் வியாபாரிகள் தங்களின் பொருட்களை இங்கு எளிதாகப் பதிவேற்றலாம்.</p>

    <div class="form-group">
      <label>கடையின் பெயர் (Store Name):</label>
      <input type="text" id="vStore" placeholder="எ.கா: SK Traders">
    </div>

    <div class="form-group">
      <label>பொருளின் பெயர் (Product Name):</label>
      <input type="text" id="vProduct" placeholder="எ.கா: இயற்கை சோப்">
    </div>

    <div class="form-group">
      <label>விற்பனை விலை (Price in Rs.):</label>
      <input type="number" id="vPrice" oninput="calculateCommission()" placeholder="எ.கா: 500">
    </div>

    <!-- கணக்காளர் பிரிவு (Automatic Calculation) -->
    <div class="calc-box">
      <div class="calc-row">
        <span>பொருளின் மொத்த விலை:</span>
        <b id="txtTotal">Rs. 0</b>
      </div>
      <div class="calc-row" style="color: #f59e0b;">
        <span>தளத்திற்கான கமிஷன் (2%):</span>
        <b id="txtComm">Rs. 0</b>
      </div>
      <div class="calc-row" style="color: #4ade80;">
        <span>கடைக்காரருக்குக் கிடைக்கும் தொகை:</span>
        <b id="txtVendorPay">Rs. 0</b>
      </div>
    </div>

    <button class="btn" onclick="submitVendorData()">🚀 பொருளைத் தளத்தில் சேர்க்கவும்</button>
  </div>

  <script>
    // கமிஷன் கணக்கிடும் சுலபமான முறை
    function calculateCommission() {
      var price = parseFloat(document.getElementById("vPrice").value) || 0;
      var commission = price * 0.02; // 2% கமிஷன்
      var vendorPayout = price - commission;

      document.getElementById("txtTotal").innerText = "Rs. " + price.toFixed(2);
      document.getElementById("txtComm").innerText = "Rs. " + commission.toFixed(2);
      document.getElementById("txtVendorPay").innerText = "Rs. " + vendorPayout.toFixed(2);
    }

    function submitVendorData() {
      var store = document.getElementById("vStore").value;
      var prod = document.getElementById("vProduct").value;
      var price = document.getElementById("vPrice").value;

      if(!store || !prod || !price) {
        alert("தயவுசெய்து அனைத்து விவரங்களையும் நிரப்பவும்!");
        return;
      }

      alert("நன்றி! " + store + " கடையின் " + prod + " பொருள் വിജയகரப் பதிவு செய்யப்பட்டது. சரிபார்த்த பின் நேரலையில் சேர்க்கப்படும்!");
    }
  </script>

</body>
</html

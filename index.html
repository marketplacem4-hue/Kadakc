<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Central | Vehicle Marketplace</title>
  
  <!-- PWA ஆப் ஆக நிறுவ உதவும் அம்சம் -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkF1dG8gQ2VudHJhbCIsCiAgInNob3J0X25hbWUiIjogIkF1dG8gQ2VudHJhbCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGIwZjE5IiwKICAidGhlbWVfY29sb3IiOiAiIzNiODJmNiIKfQ==">

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: #0b0f19; color: #f8fafc; }
    
    header {
      background: #111827;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 2px solid #3b82f6;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-title { font-size: 24px; font-weight: bold; color: #3b82f6; margin: 0; }
    .sub-title { font-size: 13px; color: #9ca3af; margin-top: 4px; }

    /* ஆப் இன்ஸ்டால் பேனர் */
    .install-banner {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: white;
      padding: 12px 15px;
      margin: 15px auto;
      max-width: 970px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .install-btn { background: white; color: #1d4ed8; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    
    .card { background: #1f2937; border-radius: 12px; padding: 15px; border: 1px solid #374151; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    
    .card-title { font-size: 18px; font-weight: bold; margin: 12px 0 4px; color: #ffffff; }
    .dealer-badge { font-size: 12px; color: #60a5fa; margin-bottom: 10px; }
    
    .car-specs { background: #111827; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: #d1d5db; margin-bottom: 12px; line-height: 1.5; }

    .price-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .price { font-size: 20px; font-weight: bold; color: #34d399; }
    
    .wa-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #25D366;
      color: white;
      padding: 11px 0;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">🚗 Auto Central</div>
    <div class="sub-title">நம்பகமான கார் மற்றும் வாகன விற்பனைத் தளம்</div>
  </header>

  <!-- ஆப் ஆக போனில் நிறுவும் பேனர் -->
  <div class="install-banner">
    <div>
      <b style="font-size: 14px;">Auto Central App-ஐ நிறுவவும்</b>
      <div style="font-size: 11px;">உங்கள் மொபைலில் செயலி (App) போலப் பயன்படுத்தலாம்!</div>
    </div>
    <button class="install-btn" onclick="alert('உங்கள் பிரௌசர் மெனுவில் (Three Dots) Add to Home Screen / Install App என்பதை அழுத்தவும்!')">📲 Install</button>
  </div>

  <div class="container">
    <div class="grid">
      
      <!-- மாதிரி கார் 1 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=500" alt="Toyota Vitz">
        <div class="card-title">Toyota Vitz 2018</div>
        <div class="dealer-badge">🛡️ Verified Dealer: Lanka Auto</div>
        
        <div class="car-specs">
          ⚙️ Automatic | ⛽ Petrol<br>
          🛣️ 45,000 KM | 🎨 Pearl White
        </div>

        <div class="price-bar">
          <div class="price">Rs. 6,500,000</div>
        </div>
        <!-- 94770000000 இடத்தில் உங்கள் வாட்ஸ்அப் எண்ணை மாற்றிச் சேமிக்கவும் -->
        <a class="wa-btn" href="https://wa.me/94770000000?text=வணக்கம்!%20Auto%20Central%20மூலம்%20'Toyota%20Vitz%202018'%20கார்%20பற்றி%20விசாரிக்க%20விரும்புகிறேன்." target="_blank">
          📲 வாட்ஸ்அப்பில் விசாரிக்க
        </a>
      </div>

    </div>
  </div>

</body>
</html
